name: "Update tools from arkade get"
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags'

  schedule:
    # Run workflow once a day to grab latest release
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install with npm
        run: |
          npm install
      - uses: alexellis/setup-arkade@v4
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          # The Go module lives in to-inputs/, not at the repo root,
          # so the default build cache has nothing to key on.
          cache: false
      - name: Regenerate changes
        run: |
          cd to-inputs
          go run . -j schema.json -y inputs.yaml
          cp schema.json ../
          cat ../action.yml.tmpl | INPUTS=$(cat inputs.yaml) envsubst > ../action.yml
          npm run prepare
      - name: Commit changes
        run: |
              IFS="/" read USERNAME REPONAME <<<$GITHUB_REPOSITORY
              git add .
              git config --global user.name "$USERNAME"
              git config --global user.email "$USERNAME@users.noreply.github.com"
              git diff-index --quiet HEAD || git commit -m "syncup with latest version"
              git push